name: Draft abandoned conversations

# Someone who talks to Prism and then closes the tab should still leave
# something behind. This asks the app to draft anyone whose conversation has
# gone quiet — one call per person who left, rather than repeated drafting
# while they're still typing.
#
# Runs here rather than on Vercel Cron because that's once-a-day on Hobby, and
# a visitor at a convention shouldn't wait until tomorrow to appear on the map.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the app to draft what was abandoned
        run: |
          response=$(curl -sS -w "\n%{http_code}" -X POST \
            "https://demo.worldcocreation.com/api/cron/draft" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 300)

          body=$(echo "$response" | sed '$d')
          code=$(echo "$response" | tail -n1)

          echo "$body"
          if [ "$code" != "200" ]; then
            echo "::error::Draft run failed with HTTP $code"
            exit 1
          fi
